name: Two Hands temporary build

on:
  push:
    branches:
      - chatgpt-twohands-build-20260924
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Reconstruct source
        shell: bash
        run: |
          cat tmp/twohands_payload_*.b64 | base64 -d > /tmp/twohands-source.zip
          echo "2b1bd2d5beb0192cfd62043e4bafa8701254136c96e6cdd97746e8adda8aede7  /tmp/twohands-source.zip" | sha256sum -c -
          unzip -t /tmp/twohands-source.zip
          mkdir -p modsrc
          unzip -q /tmp/twohands-source.zip -d modsrc

      - name: Build
        working-directory: modsrc
        run: gradle --no-daemon build

      - name: List output
        run: ls -lah modsrc/build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: twohands-jar
          path: modsrc/build/libs/*.jar
