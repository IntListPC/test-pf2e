name: Two Hands temporary build

on:
  push:
    branches:
      - chatgpt-twohands-build-20260924
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Verify and reconstruct payload
        shell: bash
        run: |
          cat > /tmp/replacement.sha256 <<'EOF'
          9553aa0a092bd945d09c568cfb7d6245b1a4e6a6eb52d9ddc6c55a991a5c0bf7  tmp/twohands_payload_10a0.b64
          b204bd89f9c439f41ad26da2b02c199adafc18ae8d33eb5a91c2de6934dd53c6  tmp/twohands_payload_10a1.b64
          9a3923d275265cec557afbb43c11fb06be0c9baa24aed6062048882ae18e13a1  tmp/twohands_payload_10a2.b64
          573fae1ad19a505f5f1df29be4b00a1d9232836fc21f4497e0792df5882a4233  tmp/twohands_payload_10a3.b64
          1770a5e9cc484e9e7e627a37e2ce46301fba323d51254dc5e264331df042dee6  tmp/twohands_payload_10a4.b64
          dcb709cf6fa2859bd371a2ff695b20f170f70d02c048438ab2dd689e091f2cfa  tmp/twohands_payload_10a5.b64
          15c9ac9bf715382407f0f0f75d812568bb6d59f2977c067d3a383c0355fbb373  tmp/twohands_payload_10b.b64
          e1733c453b0b93c2934d8a4df612c9a7a7b17182433b5ea3eb29129f1d934564  tmp/twohands_payload_10c.b64
          EOF
          sha256sum -c /tmp/replacement.sha256

          cat tmp/twohands_payload_00.b64 tmp/twohands_payload_01.b64 tmp/twohands_payload_02.b64 tmp/twohands_payload_03.b64 tmp/twohands_payload_04.b64 tmp/twohands_payload_05.b64 tmp/twohands_payload_06.b64 tmp/twohands_payload_07.b64 tmp/twohands_payload_08.b64 tmp/twohands_payload_09.b64 tmp/twohands_payload_10a0.b64 tmp/twohands_payload_10a1.b64 tmp/twohands_payload_10a2.b64 tmp/twohands_payload_10a3.b64 tmp/twohands_payload_10a4.b64 tmp/twohands_payload_10a5.b64 tmp/twohands_payload_10b.b64 tmp/twohands_payload_10c.b64 tmp/twohands_payload_11.b64 tmp/twohands_payload_12.b64 | base64 -d > /tmp/twohands-source.zip
          echo "2b1bd2d5beb0192cfd62043e4bafa8701254136c96e6cdd97746e8adda8aede7  /tmp/twohands-source.zip" | sha256sum -c -
          unzip -t /tmp/twohands-source.zip
          mkdir -p modsrc
          unzip -q /tmp/twohands-source.zip -d modsrc

      - name: Build
        working-directory: modsrc
        run: gradle --no-daemon build

      - name: List output
        run: ls -lah modsrc/build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: twohands-jar
          path: modsrc/build/libs/*.jar
