name: build-twohands
on:
  push:
    branches:
      - chatgpt-twohands-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Restore source tree
        run: |
          cat .ci/b64-0 .ci/b64-1 .ci/b64-2 .ci/b64-3 .ci/b64-4 .ci/b64-5 .ci/b64-6 > /tmp/src.b64
          echo "ee8237b5dcc9ce26b7fe49e3776f2f0ee55e8662ddd86a78f01994f8a828befd  /tmp/src.b64" | sha256sum -c -
          base64 -d /tmp/src.b64 > /tmp/twohands-src.tar.gz
          tar -xzf /tmp/twohands-src.tar.gz
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twohands-build-output
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
