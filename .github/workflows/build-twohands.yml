name: build-twohands
on:
  push:
    branches:
      - chatgpt-twohands-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Restore source tree
        run: |
          cat .ci/twohands.part0 .ci/twohands.part1 > /tmp/twohands-src.tar.gz
          tar -xzf /tmp/twohands-src.tar.gz
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twohands-build-output
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
